<div class="map-wrapper">

  <!-- Search Bar Overlay -->
  <div class="search-overlay">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>ค้นหาร้านอาหาร หรือ สถานที่</mat-label>

      <input
        matInput
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch()"
        placeholder="เช่น ส้มตำ, ชาบู, สยาม"
      />

      <button
        mat-icon-button
        matSuffix
        (click)="onSearch()"
        type="button"
      >
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>

    @if (searchError) {
      <p class="search-error">
        {{ searchError }}
      </p>
    }
  </div>

  <!-- Loading Overlay -->
  @if (isLoading) {
    <div class="loading-overlay">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  }

  <!-- Map Element -->
  <div
    #mapContainer
    class="map-container">
  </div>

  <!-- My Location Button (Tracker) -->
  <button
    mat-fab
    color="primary"
    class="location-btn"
    (click)="getCurrentLocation()"
    matTooltip="ตำแหน่งของฉัน"
    type="button"
  >
    <mat-icon>my_location</mat-icon>
  </button>

</div>
