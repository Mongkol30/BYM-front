<div class="map-wrapper">

  <!-- Search Bar Overlay -->
  <div class="search-overlay">
    <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
      <mat-label>ค้นหาร้านอาหาร หรือ เมนู</mat-label>

      <input
        matInput
        [formControl]="searchControl"
        [matAutocomplete]="auto"
        placeholder="เช่น ส้มตำ, ชาบู..."
      />

      <mat-icon matSuffix>search</mat-icon>

      <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn" (optionSelected)="onOptionSelected($event)" panelClass="modern-autocomplete-panel">
        @for (pin of pinLocations; track pin.restaurantId) {
          <mat-option [value]="pin" class="modern-option">
            <div class="option-content">
              <span class="restaurant-name">{{ pin.restaurantName }}</span>
              @if (pin.matchedMenuName) {
                <span class="matched-menu">
                  <mat-icon inline="true">restaurant_menu</mat-icon>
                  {{ pin.matchedMenuName }}
                </span>
              }
            </div>
          </mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>

  </div>

  <!-- Loading Overlay -->
  @if (isLoading) {
    <div class="loading-overlay">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  }

  <!-- Map Element -->
  <div
    #mapContainer
    class="map-container">
  </div>

  <!-- My Location Button (Tracker) -->
  <button
    mat-fab
    color="primary"
    class="location-btn"
    (click)="getCurrentLocation()"
    matTooltip="ตำแหน่งของฉัน"
    type="button"
  >
    <mat-icon>my_location</mat-icon>
  </button>

</div>
